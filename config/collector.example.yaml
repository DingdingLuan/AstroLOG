# Run separately: python -m logpresent.collector --config config/collector.yaml
# Uses the system OpenSSH client, not Paramiko. Fill in this connection directly:
ssh:
  host: 203.0.113.10
  user: my-user
  port: 2222
  identity_file: ~/.ssh/id_ed25519_my_server
  # certificate_file: ~/.ssh/id_ed25519_my_server-cert.pub  # Optional OpenSSH certificate.
# Key/certificate files must already exist; relative paths resolve from this YAML.
# Alternatively, remove the whole ssh block and use existing ~/.ssh/config aliases:
# ssh_hops: [my-server]
# ssh_hops: [relay, my-server]
# A second hop runs SSH on relay, using relay's own SSH config and key.
remote_root: /path/to/project
local_root: ../var/replicas/my-server
poll_seconds: 1
inventory_seconds: 30
inventory_max_entries: 20000
inventory_max_depth: 4
logs:
  logs/stdout.log: logs/run-*.out  # Follow the most recently modified match.
  output/info.txt: output/info.txt
  output/cpu.csv: output/cpu.csv
inventory_patterns:
  - output/snapdir_*
  - output/groups_*
  - output/restartfiles*
  - logs/run-*.out
  - logs/run-*.err
