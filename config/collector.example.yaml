# Run separately: python -m logpresent.collector --config config/collector.yaml
# Uses the system OpenSSH client, not Paramiko. Define the alias first in ~/.ssh/config:
# Host my-server
#   HostName 203.0.113.10
#   User my-user
#   Port 2222
#   IdentityFile ~/.ssh/id_ed25519_my_server
# Check it with: ssh my-server
# For [relay, my-server], the collector connects to relay, then runs SSH there.
# The second alias and its key belong in relay's SSH configuration.
ssh_hops: [my-server]
remote_root: /path/to/project
local_root: ../var/replicas/my-server
poll_seconds: 1
inventory_seconds: 30
inventory_max_entries: 20000
inventory_max_depth: 4
logs:
  logs/stdout.log: logs/run-*.out  # Follow the most recently modified match.
  output/info.txt: output/info.txt
  output/cpu.csv: output/cpu.csv
inventory_patterns:
  - output/snapdir_*
  - output/groups_*
  - output/restartfiles*
  - logs/run-*.out
  - logs/run-*.err
